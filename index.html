<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interactive Photo Gallery</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Interactive Photo Gallery</h1>

      <div id="image" aria-live="polite">
        Hover over or focus on an image to display it here.
      </div>

      <section class="gallery" aria-label="Photo gallery">
        
        <figure class="preview">
            <img src="images/iron-man.jpg" alt="Iron Man">
        </figure>

        <figure class="preview">
            <img src="images/spider-man.jpg" alt="Spider Man">
        </figure>

        <figure class="preview">
            <img src="images/kratos.jpg" alt="Kratos GOW">
        </figure>

        <figure class="preview">
            <img src="images/messi.jpg" alt="The GOAT">
        </figure>

        <figure class="preview">
            <img src="images/punisher.jpg" alt="The Punisher">
        </figure>

        <figure class="preview">
            <img src="images/jupiter.jpg" alt="Jupiter">
        </figure>

      </section>
    </main>
  </body>
</html>
